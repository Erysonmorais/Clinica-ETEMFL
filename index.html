<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#155724">
  <title>Clínica ETEMFL — Acesso</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #173b25;
      background: #f4f8f5;
    }

    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      background: url("./Logo Nosyre Tech.png") center / min(160vw, 160vh) auto no-repeat;
      background-position: center calc(50% + 40px);
      opacity: 0.55;
      pointer-events: none;
    }
    main { position: relative; z-index: 1; width: min(100%, 760px); }
    h1 { margin: 0 0 8px; color: #155724; font-size: clamp(1.8rem, 5vw, 2.6rem); text-align: center; }
    p { color: #28a745; line-height: 1.6; text-align: center; }
    .portals { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin-top: 28px; }
    a { display: block; padding: 24px; border: 1px solid #d5e2d8; border-radius: 16px; background: #fff; color: inherit; text-decoration: none; box-shadow: 0 8px 24px #173b2510; }
    a:hover, a:focus-visible { outline: 3px solid #8abf96; outline-offset: 3px; }
    a strong { display: block; margin-bottom: 8px; font-size: 1.2rem; }
    a span { color: #52665a; line-height: 1.5; }
    .site-footer { position: fixed; right: 0; bottom: 8px; left: 0; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 12px; color: #155724; font-size: 0.72rem; text-align: center; }
    .site-footer img { width: 44px; height: 44px; object-fit: contain; }
  </style>
</head>
<body>
  <main>
    <h1>Clínica ETEMFL</h1>
    <p>Escolha o portal para continuar.</p>
    <nav class="portals" aria-label="Portais da Clínica ETEMFL">
      <a href="/usuario/">
        <strong>Portal do paciente</strong>
        <span>Consulte vagas, agendamentos e comunicados.</span>
      </a>
      <a href="/gestor/">
        <strong>Portal do gestor</strong>
        <span>Gerencie profissionais, pacientes e atendimentos.</span>
      </a>
    </nav>
  </main>
  <footer class="site-footer">
    <span>© 2026 Clínica ETEMFL. Todos os direitos reservados.</span>
    <img src="./Logo Nosyre Tech.png" alt="Nosyre Tech">
  </footer>
</body>
</html>
