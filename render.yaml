databases:
  - name: etemfl-demo-db
    databaseName: etemfl
    user: etemfl
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: web
    name: etemfl-demo
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PGSSL
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: etemfl-demo-db
          property: connectionString
      - key: GESTOR_BOOTSTRAP_EMAIL
        sync: false
      - key: GESTOR_BOOTSTRAP_PASSWORD
        sync: false
