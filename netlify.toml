[build]
  command = "npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "https://etemfl-backend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/gestor"
  to = "/gestor/"
  status = 301

[[redirects]]
  from = "/usuario"
  to = "/usuario/"
  status = 301
